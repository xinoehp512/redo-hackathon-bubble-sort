<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Assignments Calendar</title>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial;
    }
    #calendar {
      max-width: 900px;
      margin: 20px auto;
    }
  </style>
</head>
<body>
  <header>
    <span class="site-title">Bubble Sort Student Hub</span>
    <nav class="nav-links">
      <a href="Hackathon\Calendar.html">Calendar</a>
      <a href="/blog">Student Blog</a>
      <a href="Hackathon\get-started.html">Sign In</a>
    </nav>
  </header>  
  
  
  <div id="setup" onload="renderCalendar()"></div>

  <div id="calendar"></div>

  
  <script>

   
    allEvents = [{
        title: 'Assignment Name',
        start: '2025-10-20T23:59:00Z',
        allDay: false
    },
    {
        title: 'Assignment Name 2',
        start: '2025-10-22T23:59:00Z',
        allDay: false
    },
    {
        title: 'Assignment Name 3',
        start: '2025-10-23T23:59:00Z',
        allDay: false
    }];


    renderCalendar(allEvents);
    function renderCalendar(events) {
      const calendarEl = document.getElementById('calendar');
      document.getElementById('setup').style.display = 'none';

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        events: events
      });

      calendar.render();
    }
  </script>
</body>
</html>
