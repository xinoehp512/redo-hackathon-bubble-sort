<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Assignments Calendar</title>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
     body {
    font-family: Arial;
  }

  #calendar {
    max-width: 900px;
    margin: 20px auto;
    background-color: white;
    padding: 20px 30px 30px 30px;
    border-radius: 10px;
  }

  #addItems {
    width: 500px;
    margin: 40px auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  #taskForm input, #taskForm button {
    padding: 0.8rem 1rem;
    border-radius: 0.7rem;
    border: 1px solid #CED2C3;
    font-size: 1rem;
  }

  #taskForm label {
    font-size: 1rem;
  }
</style>
  </style>
</head>
<body>
  <header>
        <img src="Bubble_Logo.png" alt="Bubble Sort Student Hub Logo" class="logo-img">
        <a href="student_hub.html" class="site-title">Bubble Sort Student Hub</a>
    <nav class="nav-links">
      <a href="Calendar.html">Calendar</a>
      <a href="student_life.html">Student Life</a>
      <a href="get-started.html">Sign In</a>
    </nav>
  </header>  
  
  
  <div id="setup" onload="renderCalendar()"></div>

  <div id="calendar"></div>

  <div id="addItems" style="display:flex;flex-direction:column;gap:1rem;width: 500px;">
    <form id="taskForm" style="display:flex;flex-direction:column;gap:1rem;width: 500px;">
  <input type="text" name="taskName" placeholder="New Task" required>

  <input type="datetime-local" name="taskDateTime" placeholder="Task Date & Time" required>

  <label style="font-size:1rem;">
    <input type="checkbox" name="allDay">
    All Day Task
  </label>

  <button type="submit" class="get-started-btn" style="margin-top:0.5rem;">Add</button>
</form>
  </div>

  
  <script src="calendar.js"></script>
  


</body>
</html>
