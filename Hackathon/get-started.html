<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log into Canvas | Bubble Sort Student Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span class="site-title">Bubble Sort Student Hub</span>
    <nav class="nav-links">
      <a href="/calendar">Calendar</a>
      <a href="/blog">Student Blog</a>
      <a href="/signin">Sign In</a>
    </nav>
  </header>
  <div class="flex-center">
    <div class="center-box" style="width:360px;height: 300px; padding:2.3rem 2rem; flex-direction:column;">
      <h2 style="margin-bottom: 1.7rem;">Getting Started:<br> Log into Canvas</h2>
      <form>
        <div style="display:flex;flex-direction:column;gap:1rem;">
          <input type="text" name="username" placeholder="Username" required
                 style="padding:0.8rem 1rem; border-radius:0.7rem; border:1px solid #CED2C3; font-size:1rem;">
          <input type="password" name="password" placeholder="Password" required
                 style="padding:0.8rem 1rem; border-radius:0.7rem; border:1px solid #CED2C3; font-size:1rem;">
          <button type="submit" class="get-started-btn" style="margin-top:0.5rem;">Login</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
