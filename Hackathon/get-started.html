<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log into Canvas | Bubble Sort Student Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(71,82,94,0.08);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1001;
    }
    .modal-box {
      background: #fff;
      border-radius: 1.2rem;
      box-shadow: 0 6px 20px rgba(71,82,94,0.15);
      padding: 2rem 2.5rem;
      min-width: 320px;
      text-align: center;
      font-family: 'Quicksand', Arial, sans-serif;
      color: #47525E;
    }
    .modal-box h3 {
      margin-top: 0;
      margin-bottom: 1.5rem;
      font-weight: 700;
      font-size: 1.35rem;
    }
    .modal-options {
      margin-bottom: 1.2rem;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      align-items: flex-start;
    }
    .import-btn {
      background: #47525E;
      color: #fff;
      padding: 0.7rem 2.2rem;
      font-size: 1.1rem;
      border-radius: 2rem;
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      margin-top: 0.5rem;
    }
    .import-btn:hover {
      background: #B7B7A4;
      color: #47525E;
    }
  </style>
</head>
<body>
  <header>
       <div class="header-group">
    <img src="Bubble_Logo.png" alt="Bubble Sort Student Hub Logo" class="logo-img">
    <span class="site-title">Bubble Sort Student Hub</span>
  </div>
    <nav class="nav-links">
      <a href="calendar.html">Calendar</a>
      <a href="/blog">Student Blog</a>
      <a href="/signin">Sign In</a>
    </nav>
  </header>
  <div class="flex-center">
    <div class="center-box" style="width:360px; height: 300px; padding:2.3rem 2rem; flex-direction:column;">
      <h2 style="margin-bottom: 1.7rem;">Getting Started: Log into Canvas</h2>
      <form id="login-form">
        <div style="display:flex;flex-direction:column;gap:1rem;">
          <input type="text" name="username" placeholder="Username" required
                 style="padding:0.8rem 1rem; border-radius:0.7rem; border:1px solid #CED2C3; font-size:1rem;">
          <input type="password" name="password" placeholder="Password" required
                 style="padding:0.8rem 1rem; border-radius:0.7rem; border:1px solid #CED2C3; font-size:1rem;">
          <button type="submit" class="get-started-btn" style="margin-top:0.5rem;">Login</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Custom Modal Pop-up -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-box">
      <h3>Found Classes</h3>
      <div class="modal-options">
        <label><input type="checkbox" id="cb1"> Class 1</label>
        <label><input type="checkbox" id="cb2"> Class 2</label>
        <label><input type="checkbox" id="cb3"> Class 3</label>
      </div>
      <button class="import-btn" id="import-btn">Import</button>
    </div>
  </div>

  <script>
    document.getElementById("login-form").addEventListener("submit", function(e){
      e.preventDefault();
      // Show modal
      document.getElementById('modal-overlay').style.display = 'flex';
      window.onbeforeunload = function () {
        return "You have unsaved changes or actions in progress. Are you sure you want to leave?";
      };
    });

    document.getElementById("import-btn").addEventListener("click", function() {
      // Gather checked boxes
      const classes = [];
      if(document.getElementById("cb1").checked) classes.push(1);
      if(document.getElementById("cb2").checked) classes.push(2);
      if(document.getElementById("cb3").checked) classes.push(3);

      // Remove beforeunload
      window.onbeforeunload = null;

      // Go to taskmanager.html with selected classes as query string
      window.location.href = "taskmanager.html?classes=" + encodeURIComponent(classes.join(','));
    });
  </script>
</body>
</html>
